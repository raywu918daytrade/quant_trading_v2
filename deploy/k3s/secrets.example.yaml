# 範本, 不要填真值進版控。正式用 kubectl 直接建 (值由 Ray 自己貼), 之後改用 sealed-secrets 把加密後的 SealedSecret 進版控:
#   kubectl -n fade create secret generic fade-hf      --from-literal=HF_TOKEN=...
#   kubectl -n fade create secret generic fade-line    --from-literal=LINE_CHANNEL_ACCESS_TOKEN=... --from-literal=LINE_USER_ID=...
#   kubectl -n fade create secret generic fade-sinopac --from-literal=SINOPAC_API_KEY=... --from-literal=SINOPAC_SECRET_KEY=...
#   kubectl -n fade create secret generic fade-healthchecks --from-literal=HC_LIVE=https://hc-ping.com/<uuid> --from-literal=HC_PAPER=... --from-literal=HC_NIGHTLY=... --from-literal=HC_NIGHTLY_RETRY=...
#   kubectl -n fade create secret docker-registry ghcr --docker-server=ghcr.io --docker-username=raywu918daytrade --docker-password=<read:packages PAT>
#     (GHCR package 若設成 public 就不需要 ghcr 這個 secret, CronJob 的 imagePullSecrets 可拿掉)
# 或本機 .env 一次建: kubectl -n fade create secret generic fade-hf --from-env-file=<(grep ^HF_TOKEN= .env)
apiVersion: v1
kind: Secret
metadata:
  name: fade-hf
  namespace: fade
type: Opaque
stringData:
  HF_TOKEN: "hf_xxx (raywu918daytrade, 對 dataset raywu918daytrade/daytrade 有寫入權)"
---
apiVersion: v1
kind: Secret
metadata:
  name: fade-line
  namespace: fade
type: Opaque
stringData:
  LINE_CHANNEL_ACCESS_TOKEN: "官方帳號「fade 訊號」的 long-lived channel access token"
  LINE_USER_ID: "U 開頭 33 碼"
---
apiVersion: v1
kind: Secret
metadata:
  name: fade-sinopac
  namespace: fade
type: Opaque
stringData:
  SINOPAC_API_KEY: "永豐 API key (paper_orb 只登入模擬環境)"
  SINOPAC_SECRET_KEY: "..."
---
apiVersion: v1
kind: Secret
metadata:
  name: fade-healthchecks
  namespace: fade
type: Opaque
stringData:
  HC_LIVE: "https://hc-ping.com/<uuid>  (期限 5h, 平日 08:50 開始)"
  HC_PAPER: "https://hc-ping.com/<uuid>"
  HC_NIGHTLY: "https://hc-ping.com/<uuid>  (平日 21:00, 寬限 30 分)"
  HC_NIGHTLY_RETRY: "https://hc-ping.com/<uuid>  (平日 08:10)"
