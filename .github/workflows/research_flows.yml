name: Research money flows (inst / gov banks / brokers / margin) x ORB5
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe = 只試抓; fetch = 只抓資料; full = 抓資料 + 補融資 + 跑 33 + 44"
        required: false
        default: "full"
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      TZ: Asia/Taipei
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data/flows
          key: flows-${{ github.run_id }}
          restore-keys: flows-
      - uses: actions/cache/restore@v4
        if: github.event.inputs.mode == 'full'
        with:
          path: data/chips
          key: chips-${{ github.run_id }}
          restore-keys: chips-
      - if: github.event.inputs.mode == 'probe'
        run: python3 -W ignore scripts/43_fetch_flows.py --probe
      - if: github.event.inputs.mode != 'probe'
        run: python3 -W ignore scripts/43_fetch_flows.py
      - uses: actions/cache/save@v4
        if: always() && github.event.inputs.mode != 'probe'
        with:
          path: data/flows
          key: flows-${{ github.run_id }}
      - if: github.event.inputs.mode == 'full'
        run: python3 -W ignore scripts/37_fetch_chips.py
      - uses: actions/cache/save@v4
        if: always() && github.event.inputs.mode == 'full'
        with:
          path: data/chips
          key: chips-${{ github.run_id }}
      - if: github.event.inputs.mode == 'full'
        run: python3 -W ignore scripts/33_d1_sr_orb.py > /dev/null
      - if: github.event.inputs.mode == 'full'
        run: python3 -W ignore scripts/44_money_flow.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: money_flow
          path: stats/money_flow.md
          if-no-files-found: ignore
