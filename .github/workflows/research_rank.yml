name: Research rank simultaneous breakers
on:
  workflow_dispatch:
    inputs:
      args:
        description: "extra args for scripts/33_d1_sr_orb.py (e.g. --start 2024-01)"
        required: false
        default: ""
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: Asia/Taipei
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt
      - run: python3 -W ignore scripts/33_d1_sr_orb.py ${{ github.event.inputs.args }} > /dev/null
      - run: python3 -W ignore scripts/34_rank_breakers.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank_breakers
          path: stats/rank_breakers.md
