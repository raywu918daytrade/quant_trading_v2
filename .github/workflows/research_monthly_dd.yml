name: Research monthly drawdown
on:
  workflow_dispatch:
    inputs:
      args:
        description: "extra args for scripts/41_monthly_dd.py"
        required: false
        default: ""
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: Asia/Taipei
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt
      - run: python3 -W ignore scripts/33_d1_sr_orb.py > /dev/null
      - run: python3 -W ignore scripts/40_exit_research.py --build-only
      - run: python3 -W ignore scripts/41_monthly_dd.py ${{ github.event.inputs.args }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monthly_dd
          path: stats/monthly_dd.md
