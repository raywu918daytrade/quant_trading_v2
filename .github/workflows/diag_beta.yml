name: Diag market beta (strategy vs TAIEX)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt
      - run: python3 -W ignore scripts/diag_beta.py --exclude 2026-11-10 --out stats/market_beta.md
      - uses: actions/upload-artifact@v4
        with:
          name: market_beta
          path: stats/market_beta.md
