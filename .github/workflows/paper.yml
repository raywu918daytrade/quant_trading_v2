name: Paper trade (merged into live.yml — standalone only on request)
on:
  # 2026-11-13 起模擬單合併進 live.yml (orb_live.py run --paper): 訊號與模擬單同一支程式、同一份名單 / 區間 / tick。
  # cron-job.org 08:50 仍會打這支 workflow, 所以預設什麼都不做 (否則同一個模擬帳戶會重複下單)。
  # 需要單獨跑舊的 paper_orb.py 時: 手動 Run workflow 並把 standalone 填 1 (當天 live.yml 不可同時在跑 --paper)。
  workflow_dispatch:
    inputs:
      force:
        description: "週一 / 大盤弱也照跑 (觀察用): 填 1"
        default: ""
      standalone:
        description: "單獨跑舊的 paper_orb.py (平常不用, 模擬單已合併進 live.yml): 填 1"
        default: ""
concurrency:
  group: orb-paper
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TZ: Asia/Taipei
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Merged into live.yml (nothing to do)
        if: github.event.inputs.standalone != '1'
        run: echo "::notice::模擬單已合併進 live.yml (orb_live.py run --paper), 這支 workflow 不再下單。"
      - uses: actions/checkout@v4
        if: github.event.inputs.standalone == '1'
      - uses: actions/setup-python@v5
        if: github.event.inputs.standalone == '1'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - if: github.event.inputs.standalone == '1'
        run: pip install -q -r requirements.txt shioaji
      - name: Refresh D1 (last 3 months) from HF
        if: github.event.inputs.standalone == '1'
        run: python3 -W ignore scripts/orb_live.py refresh --months 3 --m1-months 0
      - name: Run paper trading in Sinopac simulation (publish to HF)
        if: github.event.inputs.standalone == '1'
        env:
          SINOPAC_API_KEY: ${{ secrets.SINOPAC_API_KEY }}
          SINOPAC_SECRET_KEY: ${{ secrets.SINOPAC_SECRET_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -o pipefail   # Shioaji 登入時會印含身分證字號的 Session Property 行, 濾掉 (同 v1)
          F=""; [ -n "${{ github.event.inputs.force }}" ] && F="--force"
          python3 -W ignore scripts/paper_orb.py run --publish $F 2>&1 | grep --line-buffered -v "Session Property"
      - name: Upload paper results as run artifact (backup)
        if: always() && github.event.inputs.standalone == '1'
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: |
            paper/
            signals/
          if-no-files-found: ignore
          retention-days: 90
