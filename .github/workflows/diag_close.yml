name: Diag close (official vs D1 vs M1)
on:
  workflow_dispatch:
    inputs:
      args:
        description: "date:ids ... 例 2026-11-04:3211,6290"
        required: true
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Taipei
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt
      - run: python3 -W ignore scripts/orb_live.py refresh --months 2 --m1-months 2
      - run: python3 -W ignore scripts/diag_close.py ${{ github.event.inputs.args }}
