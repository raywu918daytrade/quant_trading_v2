name: Research chips (margin / MTX retail) x ORB5
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test = 只試抓幾天; fetch = 只抓資料; full = 抓資料 + 跑 33 + 38"
        required: false
        default: "full"
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      TZ: Asia/Taipei
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data/chips
          key: chips-${{ github.run_id }}
          restore-keys: chips-
      - if: github.event.inputs.mode == 'test'
        run: rm -rf /tmp/chips_test && python3 -W ignore scripts/37_fetch_chips.py --test
      - if: github.event.inputs.mode != 'test'
        run: python3 -W ignore scripts/37_fetch_chips.py
      - uses: actions/cache/save@v4
        if: always() && github.event.inputs.mode != 'test'
        with:
          path: data/chips
          key: chips-${{ github.run_id }}
      - if: github.event.inputs.mode == 'full'
        run: python3 -W ignore scripts/33_d1_sr_orb.py > /dev/null
      - if: github.event.inputs.mode == 'full'
        run: python3 -W ignore scripts/38_chips_squeeze.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chips_squeeze
          path: stats/chips_squeeze.md
          if-no-files-found: ignore
