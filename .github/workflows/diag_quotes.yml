name: Diag quotes (Sinopac snapshot vs MIS)
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "代號 (空白分隔)"
        default: ""
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt shioaji
      - env:
          SINOPAC_API_KEY: ${{ secrets.SINOPAC_API_KEY }}
          SINOPAC_SECRET_KEY: ${{ secrets.SINOPAC_SECRET_KEY }}
        run: |
          set -o pipefail   # 濾掉含身分證字號的 Session Property 行
          python3 -W ignore scripts/diag_quotes.py ${{ github.event.inputs.ids }} 2>&1 | grep --line-buffered -v "Session Property"
