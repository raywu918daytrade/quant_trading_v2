name: LINE test
on:
  # 手機也能測: GitHub App / 網頁 → Actions → LINE test → Run workflow, 先用 LINE validate API 檢查每種推播卡片的格式 (不推、不算額度), 再推一張結算卡片範例 (最近一天有進場的回測)
  workflow_dispatch:
jobs:
  line-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt
      - name: Validate every card type
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python3 -W ignore line_bot/test/validate_push.py
      - name: Push test message
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python3 -W ignore scripts/orb_live.py line-test
