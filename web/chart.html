<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>個股 K 線</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --surface: #fcfcfb; --panel: #ffffff; --line: #e6e5e0; --line2: #d6d5cf;
    --ink: #121212; --ink2: #55544f; --ink3: #8a8984;
    --up: #d33a33; --dn: #1a9e6a; --blue: #1f6fd1; --orange: #e07a00;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink); font: 14px/1.45 -apple-system, "PingFang TC", "Heiti TC", "Noto Sans TC", sans-serif; }
  header { padding: 12px 16px 6px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  h1 .sub { font-weight: 400; }
  .sub { color: var(--ink2); font-size: 12.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 16px; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-size: 12.5px; color: var(--ink2); white-space: nowrap; }
  .chip b { color: var(--ink); font-weight: 600; }
  .pos { color: var(--up); } .neg { color: var(--dn); }
  .card { margin: 6px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 8px 4px; }
  #legend { font-size: 12px; color: var(--ink2); min-height: 18px; padding: 0 4px 4px; }
  #intra { height: 62vh; min-height: 300px; max-height: 560px; }
  .key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink2); padding: 6px 4px; }
  .key i { display: inline-block; width: 16px; border-top: 2px dashed; vertical-align: middle; margin-right: 4px; }
  .others { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 16px 8px; }
  .others a { text-decoration: none; font-size: 13px; padding: 4px 10px; border-radius: 14px; border: 1px solid var(--line2); color: var(--ink); background: var(--panel); }
  .others a.on { background: #eef4fd; border-color: var(--blue); color: #1f4f9a; }
  .links { display: flex; flex-wrap: wrap; gap: 8px 16px; padding: 4px 16px 20px; font-size: 13px; }
  .links a { color: var(--blue); }
  .empty { padding: 40px 12px; text-align: center; color: var(--ink2); }
  .src { font-size: 11.5px; padding: 1px 7px; border-radius: 9px; background: #f1f0ec; color: var(--ink2); }
  .src.live { background: #eef4fd; color: #1f4f9a; }
</style>
</head>
<body>
<header><h1><span id="title">載入中…</span><span id="src" class="src"></span></h1><div class="sub" id="subtitle"></div></header>
<div class="chips" id="chips"></div>
<div class="card">
  <div id="legend"></div>
  <div id="intra"></div>
  <div class="key"><span><i style="border-color:var(--blue)"></i>區間低 = 進場線</span><span><i style="border-color:var(--orange)"></i>區間高 = 停損線</span><span><i style="border-color:var(--ink3);border-top-style:dotted"></i>昨收</span><span>▼ 放空　▲ 回補</span></div>
</div>
<div class="others" id="others"></div>
<div class="links" id="links"></div>
<script>
// 個股 K 線: LINE 推播的「📈 K線」按鈕連到這裡 (chart.html?d=日期&s=代號)。
// 資料順序: (1) 當天盤中 live.json (orb_live.py 自己記的 1 分 K, 盤中每 20 秒重讀) → (2) 過去日 db/orb/live/<d>/<d>_chart.json → (3) 夜間回測 web/days/<d>.json (完整 1 分 K)。
const $ = (id) => document.getElementById(id);
const HF = "https://huggingface.co/datasets/raywu918daytrade/daytrade/resolve/main/db/orb/";
const QS = new URLSearchParams(location.search);
const D = QS.get("d") || new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
let SID = QS.get("s") || "";
const ACTIVE = ["盤前", "等待 09:05", "監看中", "等待收盤", "收盤回補提醒"];
const C = { up: "#d33a33", dn: "#1a9e6a", blue: "#1f6fd1", orange: "#e07a00", gray: "#8a8984", grid: "#efeee9", ink2: "#55544f" };
const fmt = (v, d = 2) => v === null || v === undefined || !Number.isFinite(+v) ? "–" : (+v).toFixed(d);
const pct = (v) => v === null || v === undefined ? "–" : `<span class="${v > 0 ? "pos" : v < 0 ? "neg" : ""}">${v > 0 ? "+" : ""}${(+v).toFixed(2)}%</span>`;
const hms = (t) => { if (t === null || t === undefined || !Number.isFinite(+t)) return "–"; const s = Math.round(t * 60) + 9 * 3600; return [Math.floor(s / 3600), Math.floor(s / 60) % 60].map((x) => String(x).padStart(2, "0")).join(":"); };
const get = async (u) => { const r = await fetch(u + (u.includes("?") ? "&" : "?") + "t=" + Date.now()); if (!r.ok) throw new Error(r.status); return r.json(); };

const chart = LightweightCharts.createChart($("intra"), {
  layout: { background: { color: "#ffffff" }, textColor: C.ink2, fontSize: 11 }, grid: { vertLines: { color: C.grid }, horzLines: { color: C.grid } },
  rightPriceScale: { borderColor: "#e6e5e0" }, crosshair: { mode: 0 },
  timeScale: { borderColor: "#e6e5e0", timeVisible: true, secondsVisible: false, rightOffset: 6 },
  localization: { timeFormatter: (ts) => new Date(ts * 1000).toISOString().slice(11, 16) },
  handleScroll: { mouseWheel: false, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false }, handleScale: { mouseWheel: false, pinch: true, axisPressedMouseMove: true } });
const cs = chart.addCandlestickSeries({ upColor: C.up, downColor: C.dn, wickUpColor: C.up, wickDownColor: C.dn, borderVisible: false, priceLineVisible: false });
const vs = chart.addHistogramSeries({ priceFormat: { type: "volume" }, priceScaleId: "", lastValueVisible: false, priceLineVisible: false });
vs.priceScale().applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
let RANGE = null, BARS = {}, LINES = [];
cs.applyOptions({ autoscaleInfoProvider: (orig) => { const r = orig(); if (r && RANGE) { r.priceRange.minValue = Math.min(r.priceRange.minValue, RANGE[0]); r.priceRange.maxValue = Math.max(r.priceRange.maxValue, RANGE[1]); } return r; } });
new ResizeObserver(() => $("intra") && chart.applyOptions({ width: $("intra").clientWidth, height: $("intra").clientHeight })).observe($("intra"));
chart.subscribeCrosshairMove((p) => { const b = p.time && BARS[p.time]; $("legend").innerHTML = b ? `${new Date(p.time * 1000).toISOString().slice(11, 16)}　開 ${fmt(b.o)}　高 ${fmt(b.h)}　低 ${fmt(b.l)}　收 <span class="${b.c >= b.o ? "pos" : "neg"}">${fmt(b.c)}</span>　量 ${Math.round(b.v).toLocaleString()} 張` : LEG; });
let LEG = "";

// 統一格式: { kind, phase, rows: [{stock_id,name,pc,rl,rh,state_txt,entry_t,entry_px,exit_t,exit_px,reason,pnl_pct}], bars: {sid: [[t,o,h,l,c,v]]} }
async function load() {
  try {
    const j = await get(HF + "live.json");
    if (j.date === D && j.watch) return fromLive(j, "live");
  } catch (e) { }
  try { const j = await get(HF + `live/${D}/${D}_chart.json`); if (j.watch) return fromLive(j, "day"); } catch (e) { }
  try { const j = await get(HF + `web/days/${D}.json`); return fromBt(j); } catch (e) { }
  return null;
}
function fromLive(j, kind) {
  const rows = j.watch.map((r) => ({ ...r, reason: r.state === "STOPPED" ? "停損" : r.state === "CLOSED" ? "收盤回補" : "" }));
  return { kind, phase: j.phase, updated: j.updated_at, rows, bars: j.bars || {} };
}
function fromBt(j) {
  const rows = [], bars = {};
  for (const [sid, b] of Object.entries(j.bars || {})) {
    const f = b.info || {};
    rows.push({ stock_id: sid, name: f.name, pc: f.pc, rl: f.rl, rh: f.rh, state_txt: f.reason || f.status || "", entry_t: f.entry_t, entry_px: f.entry_px, exit_t: f.exit_t, exit_px: f.exit_px, reason: f.reason || "", pnl_pct: f.r_pct });
    bars[sid] = b.i || [];
  }
  return { kind: "bt", phase: "回測", rows, bars };
}

let DATA = null, TIMER = null;
async function refresh() {
  DATA = await load();
  if (!DATA) {
    $("title").textContent = `${SID} ${D}`; $("src").hidden = true;
    $("intra").parentElement.innerHTML = `<div class="empty">${D} 還沒有資料。<br>盤中 K 線從 09:05 開始記錄；過去的日子要等當晚回測更新後才有。</div>`;
    if (D === new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10)) setTimeout(() => location.reload(), 60000);   // 今天: 每分鐘再試
    return;
  }
  if (!SID || !DATA.rows.find((r) => r.stock_id === SID)) SID = (DATA.rows.find((r) => r.entry_px !== null && r.entry_px !== undefined) || DATA.rows[0] || {}).stock_id || SID;
  render();
  clearTimeout(TIMER);
  if (DATA.kind === "live" && ACTIVE.includes(DATA.phase)) TIMER = setTimeout(refresh, 20000);
}
function render() {
  const r = DATA.rows.find((x) => x.stock_id === SID) || { stock_id: SID };
  document.title = `${SID} ${r.name || ""} K 線`;
  $("title").textContent = `${SID} ${r.name || ""}`;
  $("src").textContent = { live: "盤中即時", day: "當日紀錄", bt: "回測 (夜間)" }[DATA.kind] + (DATA.kind === "live" ? ` · ${DATA.phase}` : "");
  $("src").className = "src" + (DATA.kind === "live" ? " live" : "");
  $("subtitle").textContent = `${D}` + (DATA.updated ? `　更新 ${DATA.updated.slice(11, 19)}` : "");
  const has = r.entry_px !== null && r.entry_px !== undefined && Number.isFinite(+r.entry_px);
  const ex = r.exit_px !== null && r.exit_px !== undefined && Number.isFinite(+r.exit_px);
  $("chips").innerHTML = [["狀態", r.state_txt || "–"], ["進場線", fmt(r.rl)], ["停損線", fmt(r.rh)],
    ...(has ? [["放空", `${hms(r.entry_t)} @ ${fmt(r.entry_px)}`]] : []), ...(ex ? [[r.reason.startsWith("停損") ? "停損" : "回補", `${hms(r.exit_t)} @ ${fmt(r.exit_px)}`]] : []),
    ...(has && r.pnl_pct !== null && r.pnl_pct !== undefined ? [["報酬", pct(r.pnl_pct)]] : [])].map(([k, v]) => `<span class="chip">${k} <b>${v}</b></span>`).join("");
  const [y, m, d] = D.split("-").map(Number); const t0 = Date.UTC(y, m - 1, d, 9, 0) / 1000;
  BARS = {};
  const raw = DATA.bars[SID] || [];
  const bars = raw.map(([t, o, h, l, c, v]) => { const tt = t0 + t * 60; BARS[tt] = { o, h, l, c, v }; return { time: tt, open: o, high: h, low: l, close: c, v }; });
  cs.setData(bars); vs.setData(bars.map((b) => ({ time: b.time, value: b.v, color: b.close >= b.open ? "rgba(211,58,51,0.45)" : "rgba(26,158,106,0.45)" })));
  RANGE = r.rl && r.rh ? [+r.rl, +r.rh] : null;
  LINES.forEach((p) => cs.removePriceLine(p)); LINES = [];
  const pl = (price, color, title, style) => price && LINES.push(cs.createPriceLine({ price: +price, color, lineWidth: 2, lineStyle: style, axisLabelVisible: true, title }));
  pl(r.rh, C.orange, "停損", 2); pl(r.rl, C.blue, "進場", 2); pl(r.pc, C.gray, "昨收", 1);
  const near = (t) => { const tt = t0 + Math.floor(t) * 60; if (BARS[tt]) return tt; const ks = Object.keys(BARS).map(Number).filter((k) => k <= tt); return ks.length ? Math.max(...ks) : bars[0] && bars[0].time; };
  const mk = [];
  if (has && bars.length) mk.push({ time: near(r.entry_t), position: "aboveBar", color: C.blue, shape: "arrowDown", text: `空 ${fmt(r.entry_px)}` });
  if (ex && bars.length) mk.push({ time: near(r.exit_t), position: "belowBar", color: r.reason.startsWith("停損") ? C.orange : "#444", shape: "arrowUp", text: `${r.reason.startsWith("停損") ? "停損" : "補"} ${fmt(r.exit_px)}` });
  cs.setMarkers(mk.filter((x) => x.time).sort((a, b) => a.time - b.time));
  LEG = bars.length ? `1 分 K　${DATA.kind === "bt" ? "回測用歷史分 K" : "盤中每 10 秒取樣 (09:00~09:04 合成 1 根)"}` : "這檔還沒有分 K (盤中從 09:05 開始記錄)";
  $("legend").innerHTML = LEG;
  if (bars.length) chart.timeScale().setVisibleLogicalRange({ from: -4, to: bars.length + 5 });   // 左右留白, 進場標記文字不被切掉
  const others = [...DATA.rows].sort((a, b) => (b.entry_px != null) - (a.entry_px != null));
  $("others").innerHTML = others.map((x) => `<a href="?d=${D}&s=${x.stock_id}" data-s="${x.stock_id}" class="${x.stock_id === SID ? "on" : ""}">${x.entry_px != null ? "▼ " : ""}${x.stock_id} ${x.name || ""}</a>`).join("");
  $("others").querySelectorAll("a").forEach((a) => a.onclick = (e) => { e.preventDefault(); SID = a.dataset.s; history.replaceState(null, "", `?d=${D}&s=${SID}`); render(); });
  const yahoo = `https://tw.stock.yahoo.com/quote/${SID}`;
  $("links").innerHTML = `<a href="index.html#live/${D}">今日訊號頁</a><a href="index.html#${D}/${SID}">回測 K 線 (含日 K)</a><a href="${yahoo}" target="_blank" rel="noopener">Yahoo 股市</a>`;
}
refresh();
</script>
</body>
</html>
